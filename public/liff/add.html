<title>FITPEAK 公式LINE</title>
<!--
  友だち追加用LIFF（静的ページ・CDN配信で即表示）
  LINE Developers「FITPEAK 友だち追加（クレアショットLP）」のエンドポイントURLに設定する。
  流れ（画面は出さず、判定が済んだ瞬間に次へ進める）:
    LINEアプリ内で開く → liff.init（自動ログイン・友だち追加オプション aggressive）→ 友だち判定
      ・友だち     → そのままトーク画面へ（中間画面なし）
      ・未友だち   → LINEの友だち追加画面へ自動で送る（「追加」1タップで完了。追加後は follow webhook が
                     このクリックを確定して CAPI を送る）
    記録（経路確定・Meta CAPI）は /api/line-crm/liff/confirm に裏送り。
  画面に文字が出るのは、自動遷移が起きなかった時の保険ボタンだけ。
-->

  html,body{margin:0;background:#fff;font-family:"Noto Sans JP","Hiragino Sans",-apple-system,sans-serif;color:#222}

  .logo{display:block;height:auto;max-width:70%;margin:0 auto 26px}
  h1{font-size:20px;margin:0 0 10px}
  p{font-size:14px;line-height:1.7;color:#555;margin:0 0 22px}
  .btn{display:block;width:100%;max-width:360px;padding:16px;border-radius:12px;background:#06C755;color:#fff;font-weight:700;font-size:17px;text-decoration:none;box-sizing:border-box}
  .spinner{width:48px;height:48px;border:5px solid #e3efe8;border-top-color:#06C755;border-radius:50%;animation:s .9s linear infinite;margin:0 auto 20px}
  .sub{font-size:12px;color:#888;margin:-10px 0 0}
  @keyframes s{to{transform:rotate(360deg)}}
  .mascots{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin:6px auto 4px}
  .mascots img{width:84px;height:auto;animation:hop 1.4s ease-in-out infinite}
  .mascots img:nth-child(2){animation-delay:.25s;width:92px}.mascots img:nth-child(3){animation-delay:.5s}
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  @media(prefers-reduced-motion:reduce){.mascots img{animation:none}}
  .hidden{display:none}

  <div id="manual" class="hidden"><h1>FITPEAK 公式LINE</h1><p>40％OFFクーポンと先行予約のご案内をお送りします。</p><a class="btn" id="manual-btn" href="https://line.me/R/ti/p/@956iyppc">友だち追加する</a></div>
</div>
<script>
function fpRun(){
  var LIFF_ID = '2006537445-rcvSBpCP';
  var ADD_URL = 'https://line.me/R/ti/p/@956iyppc';
  var TALK_URL = 'https://line.me/R/oaMessage/%40956iyppc/';
  var API = location.origin + '/api/line-crm/liff/confirm';
  function show(id){ ['loading','manual'].forEach(function(k){ document.getElementById(k).className = (k===id?'':'hidden'); }); }
  function qp(k){ var q = new URLSearchParams(location.search); var v = q.get(k); if (v) return v;
    try { var st = q.get('liff.state'); if (st) { var q2 = new URLSearchParams(st.charAt(0) === '?' ? st.slice(1) : st); return q2.get(k) || ''; } } catch (e) {} return ''; }
  function state(){ return (qp('code')||'ytq6hwej') + '.' + (qp('cid')||''); }
  // 自動遷移が起きなかった場合の保険（ボタンを出す）
  function go(url, label){
    var b = document.getElementById('manual-btn'); b.href = url; b.textContent = label;
    try { location.replace(url); } catch (e) { location.href = url; }
    setTimeout(function(){ if (document.visibilityState === 'visible') show('manual'); }, 1800);
  }
  // ── My FITPEAK のLINEログイン（?mode=myfp）──────────────────────────────
  // スマホのブラウザで「LINEでログイン」を押したとき、LINEのWeb画面ではなくLINEアプリを直接開く。
  // https://liff.line.me/<LIFF_ID>?mode=myfp&redirect=/my-fitpeak が入口。
  // アプリで認証 → /api/my-fitpeak/auth/line でセッション用トークンを受け取り → my.fitpeak.co へ戻す。
  // 失敗したときは従来のWebログイン（/auth/line/start?web=1）へ切り替える。
  var MYFP_BASE = 'https://my.fitpeak.co';
  var isMyFp = qp('mode') === 'myfp';
  var myfpRedirect = qp('redirect'); if (!myfpRedirect || myfpRedirect.charAt(0) !== '/') myfpRedirect = '/my-fitpeak';
  function myfpWebFallback(){ location.replace(MYFP_BASE + '/api/my-fitpeak/auth/line/start?web=1&redirect=' + encodeURIComponent(myfpRedirect)); }
  if (isMyFp) {
    if (!window.liff) { myfpWebFallback(); return; }
    setTimeout(myfpWebFallback, 12000);
    liff.init({ liffId: LIFF_ID }).then(function(){
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
      var body = { accessToken: liff.getAccessToken() };
      try { var it = liff.getIDToken(); if (it) body.idToken = it; } catch (e) {}
      return fetch(location.origin + '/api/my-fitpeak/auth/line', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) })
        .then(function(r){ return r.json().then(function(d){ if (!r.ok || !d.tokenHash) throw new Error(d.error || 'login failed'); return d; }); })
        .then(function(d){ location.replace(MYFP_BASE + '/my-fitpeak/login#' + new URLSearchParams({ lt: d.tokenHash, next: myfpRedirect }).toString()); });
    }).catch(function(e){ console.error(e); myfpWebFallback(); });
    return;
  }

  if (!window.liff) { show('manual'); return; }
  var watchdog = setTimeout(function(){ show('manual'); }, 7000);
  liff.init({ liffId: LIFF_ID }).then(function(){
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    return liff.getFriendship().catch(function(){ return { friendFlag: false }; }).then(function(fr){
      clearTimeout(watchdog);
      // 記録（経路確定・CAPI）は裏で送る。未友だちの場合も userId を記録し、追加後の webhook で確定する
      try {
        fetch(API, { method:'POST', headers:{'Content-Type':'application/json'}, keepalive: true,
          body: JSON.stringify({ accessToken: liff.getAccessToken(), state: state(), friendFlag: !!fr.friendFlag, ua: navigator.userAgent }) }).catch(function(){});
      } catch (e) {}
      if (fr.friendFlag) go(TALK_URL, 'トークを開く');
      else go(ADD_URL, '友だち追加する');
    });
  }).catch(function(e){ clearTimeout(watchdog); console.error(e); show('manual'); });
}
/* LINEのSDKは、画面（ロゴと読み込み中表示）を先に出してから読み込む。
   SDKをhead内で同期読み込みすると、読み込みが終わるまで真っ白な画面になっていた */
(function(){
  var started = false;
  function start(){ if (started) return; started = true; fpRun(); }
  var sc = document.createElement('script');
  sc.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js';
  sc.async = true; sc.onload = start; sc.onerror = start;
  document.head.appendChild(sc);
  setTimeout(start, 8000); /* SDKが遅いときも、手動ボタンへ進めるようにする */
})();
</script>
