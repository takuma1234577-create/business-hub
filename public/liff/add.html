<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>FITPEAK 公式LINE</title>
<!--
  友だち追加用LIFF（静的ページ・CDN配信で即表示）
  LINE Developers「FITPEAK 友だち追加（クレアショットLP）」のエンドポイントURLに設定する。
  流れ（画面は出さず、判定が済んだ瞬間に次へ進める）:
    LINEアプリ内で開く → liff.init（自動ログイン・友だち追加オプション aggressive）→ 友だち判定
      ・友だち     → そのままトーク画面へ（中間画面なし）
      ・未友だち   → LINEの友だち追加画面へ自動で送る（「追加」1タップで完了。追加後は follow webhook が
                     このクリックを確定して CAPI を送る）
    記録（経路確定・Meta CAPI）は /api/line-crm/liff/confirm に裏送り。
  画面に文字が出るのは、自動遷移が起きなかった時の保険ボタンだけ。
-->
<style>
  html,body{margin:0;background:#fff;font-family:"Noto Sans JP","Hiragino Sans",-apple-system,sans-serif;color:#222}
  .wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;text-align:center;box-sizing:border-box}
  .logo{font-weight:900;font-size:22px;letter-spacing:.04em;color:#3F9403;margin-bottom:18px}
  h1{font-size:20px;margin:0 0 10px}
  p{font-size:14px;line-height:1.7;color:#555;margin:0 0 22px}
  .btn{display:block;width:100%;max-width:360px;padding:16px;border-radius:12px;background:#06C755;color:#fff;font-weight:700;font-size:17px;text-decoration:none;box-sizing:border-box}
  .spinner{width:36px;height:36px;border:4px solid #e6ecd8;border-top-color:#06C755;border-radius:50%;animation:s 1s linear infinite;margin:0 auto 18px}
  @keyframes s{to{transform:rotate(360deg)}}
  .hidden{display:none}
</style>
<link rel="preconnect" href="https://api.line.me"><link rel="preconnect" href="https://access.line.me">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body><div class="wrap">
  <div class="logo">//FITPEAK</div>
  <div id="loading"><div class="spinner"></div><p>公式LINEを開いています…</p></div>
  <div id="manual" class="hidden"><h1>FITPEAK 公式LINE</h1><p>40％OFFクーポンと先行予約のご案内をお送りします。</p><a class="btn" id="manual-btn" href="https://line.me/R/ti/p/@956iyppc">友だち追加する</a></div>
</div>
<script>
(function(){
  var LIFF_ID = '2006537445-rcvSBpCP';
  var ADD_URL = 'https://line.me/R/ti/p/@956iyppc';
  var TALK_URL = 'https://line.me/R/oaMessage/%40956iyppc/';
  var API = location.origin + '/api/line-crm/liff/confirm';
  function show(id){ ['loading','manual'].forEach(function(k){ document.getElementById(k).className = (k===id?'':'hidden'); }); }
  function qp(k){ var q = new URLSearchParams(location.search); var v = q.get(k); if (v) return v;
    try { var st = q.get('liff.state'); if (st) { var q2 = new URLSearchParams(st.charAt(0) === '?' ? st.slice(1) : st); return q2.get(k) || ''; } } catch (e) {} return ''; }
  function state(){ return (qp('code')||'ytq6hwej') + '.' + (qp('cid')||''); }
  // 自動遷移が起きなかった場合の保険（ボタンを出す）
  function go(url, label){
    var b = document.getElementById('manual-btn'); b.href = url; b.textContent = label;
    try { location.replace(url); } catch (e) { location.href = url; }
    setTimeout(function(){ if (document.visibilityState === 'visible') show('manual'); }, 1800);
  }
  if (!window.liff) { show('manual'); return; }
  var watchdog = setTimeout(function(){ show('manual'); }, 7000);
  liff.init({ liffId: LIFF_ID }).then(function(){
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    return liff.getFriendship().catch(function(){ return { friendFlag: false }; }).then(function(fr){
      clearTimeout(watchdog);
      // 記録（経路確定・CAPI）は裏で送る。未友だちの場合も userId を記録し、追加後の webhook で確定する
      try {
        fetch(API, { method:'POST', headers:{'Content-Type':'application/json'}, keepalive: true,
          body: JSON.stringify({ accessToken: liff.getAccessToken(), state: state(), friendFlag: !!fr.friendFlag, ua: navigator.userAgent }) }).catch(function(){});
      } catch (e) {}
      if (fr.friendFlag) go(TALK_URL, 'トークを開く');
      else go(ADD_URL, '友だち追加する');
    });
  }).catch(function(e){ clearTimeout(watchdog); console.error(e); show('manual'); });
})();
</script>
</body></html>
